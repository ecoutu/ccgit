name: Release

on:
  push:
    branches: [main]

# semantic-release needs to push the changelog/tags and create the GitHub release.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two releases against the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so semantic-release can read tags/commits.
          fetch-depth: 0
          # semantic-release manages its own auth via GITHUB_TOKEN.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Release
        env:
          # @semantic-release/git pushes the changelog/version bump back to main,
          # which the branch ruleset only lets the repo owner do. GH_PAT is a
          # fine-grained PAT owned by that bypass actor; the default GITHUB_TOKEN
          # (github-actions[bot]) is not a bypass actor and gets GH013-rejected.
          # semantic-release resolves GH_TOKEN || GITHUB_TOKEN, so GH_TOKEN wins
          # here while GITHUB_TOKEN stays the built-in token for any other tooling.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release
